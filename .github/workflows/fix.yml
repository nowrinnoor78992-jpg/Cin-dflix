name: Fix layout
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p addon
          git mv manifest.json addon/manifest.json
          [ -d catalog ] && git mv catalog addon/catalog
          [ -d meta ] && git mv meta addon/meta
          [ -d stream ] && git mv stream addon/stream
          [ -d tools ] && git mv tools addon/tools
          cat > manifest.json <<'EOF'
          {
            "name": "CineFlex",
            "version": "1.2.4",
            "description": "ISP media servers (CineplexBD movies+series, ShowTime movies+series)",
            "scrapers": [
              {
                "id": "cineflex",
                "name": "CineFlex",
                "description": "CineplexBD (new server) + ShowTime + FTPBD",
                "version": "1.2.4",
                "filename": "dflix.js",
                "supportedTypes": ["movie", "tv"],
                "enabled": true
              }
            ]
          }
          EOF
          
          git config user.name bot; git config user.email bot@example.com
          git add -A; git commit -m "separate addon and scraper"; git push
